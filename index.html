<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>Pomodoro Timer</h1>

    <div class="modes">
      <button id="focus-btn" class="mode active">Focus</button>
      <button id="short-btn" class="mode">Short break</button>
      <button id="long-btn" class="mode">Long break</button>
    </div>

    <div id="timer">25:00</div>

    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="reset-btn">Reset</button>
    </div>

    <p>Sessions done today: <span id="sessions">0</span></p>
  </div>
</body>
</html>
