<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <style>
body {
  font-family: Arial, sans-serif;
  background-color: #2b3a42;
  color: white;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  background-color: #3f5260;
  padding: 30px 40px;
  border-radius: 12px;
  text-align: center;
  width: 320px;
}

h1 {
  font-size: 24px;
  margin-top: 0;
}

.modes {
  display: flex;
  gap: 6px;
  justify-content: center;
}

.mode {
  background-color: transparent;
  color: white;
  border: 1px solid white;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 13px;
}

.mode.active {
  background-color: white;
  color: #2b3a42;
}

#timer {
  font-size: 72px;
  font-weight: bold;
  margin: 25px 0;
}

.controls button {
  background-color: #f2a65a;
  border: none;
  border-radius: 6px;
  padding: 10px 24px;
  font-size: 16px;
  cursor: pointer;
  margin: 0 5px;
}

.controls button:hover {
  background-color: #e8943f;
}
</style>
</head>
<body>
  <div class="container">
    <h1>Pomodoro Timer</h1>

    <div class="modes">
      <button id="focus-btn" class="mode active">Focus</button>
      <button id="short-btn" class="mode">Short break</button>
      <button id="long-btn" class="mode">Long break</button>
    </div>

    <div id="timer">25:00</div>

    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="reset-btn">Reset</button>
    </div>

    <p>Sessions done today: <span id="sessions">0</span></p>
  </div>

  <script>
// Pomodoro timer
// times are in minutes
var focusTime = 25;
var shortBreak = 5;
var longBreak = 15;

var timeLeft = focusTime * 60; // in seconds
var currentMode = "focus";
var interval = null;
var isRunning = false;
var sessions = 0;

// getting the elements from the page
var timerDisplay = document.getElementById("timer");
var startBtn = document.getElementById("start-btn");
var resetBtn = document.getElementById("reset-btn");
var sessionsDisplay = document.getElementById("sessions");
var modeButtons = document.querySelectorAll(".mode");

var focusBtn = document.getElementById("focus-btn");
var shortBtn = document.getElementById("short-btn");
var longBtn = document.getElementById("long-btn");

function updateDisplay() {
  var minutes = Math.floor(timeLeft / 60);
  var seconds = timeLeft % 60;

  // add a 0 in front if the number is less than 10
  if (minutes < 10) {
    minutes = "0" + minutes;
  }
  if (seconds < 10) {
    seconds = "0" + seconds;
  }

  timerDisplay.textContent = minutes + ":" + seconds;
  document.title = minutes + ":" + seconds + " - Pomodoro";
}

function playSound() {
  // simple beep, found this way on MDN
  var ctx = new AudioContext();
  var osc = ctx.createOscillator();
  osc.connect(ctx.destination);
  osc.frequency.value = 600;
  osc.start();
  osc.stop(ctx.currentTime + 0.5);
}

function tick() {
  timeLeft = timeLeft - 1;
  updateDisplay();

  if (timeLeft <= 0) {
    clearInterval(interval);
    isRunning = false;
    startBtn.textContent = "Start";
    playSound();

    if (currentMode === "focus") {
      sessions = sessions + 1;
      sessionsDisplay.textContent = sessions;
    }
  }
}

function startPause() {
  if (isRunning) {
    // pause
    clearInterval(interval);
    isRunning = false;
    startBtn.textContent = "Start";
  } else {
    // start
    if (timeLeft <= 0) {
      return;
    }
    interval = setInterval(tick, 1000);
    isRunning = true;
    startBtn.textContent = "Pause";
  }
}

function setMode(mode) {
  clearInterval(interval);
  isRunning = false;
  startBtn.textContent = "Start";
  currentMode = mode;

  if (mode === "focus") {
    timeLeft = focusTime * 60;
  } else if (mode === "short") {
    timeLeft = shortBreak * 60;
  } else {
    timeLeft = longBreak * 60;
  }

  // remove active from all buttons then add it to the right one
  for (var i = 0; i < modeButtons.length; i++) {
    modeButtons[i].classList.remove("active");
  }
  if (mode === "focus") focusBtn.classList.add("active");
  if (mode === "short") shortBtn.classList.add("active");
  if (mode === "long") longBtn.classList.add("active");

  updateDisplay();
}

function reset() {
  setMode(currentMode);
}

startBtn.addEventListener("click", startPause);
resetBtn.addEventListener("click", reset);
focusBtn.addEventListener("click", function () { setMode("focus"); });
shortBtn.addEventListener("click", function () { setMode("short"); });
longBtn.addEventListener("click", function () { setMode("long"); });

updateDisplay();
</script>
</body>
</html>
